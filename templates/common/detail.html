{% extends "base.html" %}{% load common_tags %}{% block title %}{{ page_title }} · CRM{% endblock %}{% block content %}
<h1>{{ page_title }}</h1><div class="detail-card">{% for label, value in object|get_fields %}<p><strong>{{ label }}:</strong> {{ value|default:"—" }}</p>{% endfor %}</div><div class="actions"><a class="button" href="{% url edit_url object.pk %}">Редактировать</a><a class="button danger-bg" href="{% url delete_url object.pk %}">Удалить</a><a class="button secondary" href="javascript:history.back()">Назад</a></div>
{% endblock %}
